name: sky-analytics-engine

# Base configuration for HDFS worker nodes
x-hdfs-worker-base: &hdfs-worker-base
    image: matnar/hadoop:3.3.2
    networks:
        - sae-net
    tty: true
    stdin_open: true
    command: ["sh", "-c", "service ssh start; bash"]

# Base configuration for Spark worker nodes
x-spark-worker-base: &spark-worker-base
    image: apache/spark:3.5.1
    user: root
    networks:
        - sae-net
    depends_on:
        - spark-master
    # Use absolute paths and point to the master service name
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
        - ./data:/opt/spark/data

services:

    # Storage Layer - HDFS
    hdfs-master:
        image: matnar/hadoop:3.3.2
        container_name: hdfs-master
        hostname: master
        networks:
            - sae-net
        ports:
            - "9870:9870" # HDFS Web UI
            - "9000:9000" # HDFS RPC NameNode
        volumes:
            - ./hadoop/config:/usr/local/hadoop/etc/hadoop
        # this is needed to keep the container running
        tty: true
        stdin_open: true
        command: ["sh", "-c", "service ssh start; bash"]

    hdfs-worker-1:
        <<: *hdfs-worker-base
        container_name: hdfs-worker-1
        hostname: worker-1

    hdfs-worker-2:
        <<: *hdfs-worker-base
        container_name: hdfs-worker-2
        hostname: worker-2

    # Ingestion Layer - NiFi
    nifi:
        image: apache/nifi:latest
        container_name: nifi
        hostname: nifi
        networks:
            - sae-net
        ports:
            - "8443:8443" # NiFi Web UI https
            - "8081:8081" # NiFi Web UI http
        environment:
            - NIFI_WEB_HTTP_PORT=8081
            - SINGLE_USER_CREDENTIALS_USERNAME=admin
            - SINGLE_USER_CREDENTIALS_PASSWORD=prova123456789prova
        volumes:
            - ./data/raw:/opt/nifi/nifi-current/data
            - ./data/conv:/opt/nifi/nifi-current/res
            - ./hadoop/config:/opt/nifi/nifi-current/conf/hadoop-config:ro
            - ./nifi/extensions:/opt/nifi/nifi-current/nar_extensions
        links:
            - hdfs-master:master
            - hdfs-worker-1:worker-1
            - hdfs-worker-2:worker-2

    # Processing Layer - Spark
    spark-master:
        image: apache/spark:3.5.1
        container_name: spark-master
        hostname: spark-master
        user: root
        networks:
            - sae-net
        # Use absolute paths to the binaries
        command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
        ports:
            - '8080:8080' # Spark Master Web UI
            - '7077:7077' # Spark Master Port
        volumes:
            - ./data:/opt/spark/data
            - ./spark:/opt/spark/scripts
    
    spark-worker-1:
        <<: *spark-worker-base
        container_name: spark-worker-1
        hostname: spark-worker-1

    spark-worker-2:
        <<: *spark-worker-base
        container_name: spark-worker-2
        hostname: spark-worker-2

    # Visualization Layer - Redis + Grafana
    redis:
        image: redis:latest
        container_name: redis
        hostname: redis
        networks:
            - sae-net
        ports:
            - "6379:6379" # Redis Port

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        hostname: grafana
        networks:
            - sae-net
        ports:
            - "3000:3000" # Grafana Web UI
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=prova123456789prova
        depends_on:
            - redis

networks:
    sae-net:
        driver: bridge