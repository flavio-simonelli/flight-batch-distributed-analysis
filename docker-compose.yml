name: sky-analytics-engine

networks:
    sae-net:
        driver: bridge

services:
    # Storage Layer - HDFS
    hdfs-master:
        image: matnar/hadoop:3.3.2
        container_name: hdfs-master
        hostname: master
        networks:
            - sae-net
        ports:
            - "9870:9870" # HDFS Web UI
            - "9000:9000" # HDFS RPC NameNode
        # this is needed to keep the container running
        tty: true
        stdin_open: true
        command: ["sh", "-c", "service ssh start; bash"]

    hdfs-slave1:
        image: matnar/hadoop:3.3.2
        container_name: hdfs-slave1
        hostname: slave1
        networks:
            - sae-net
        tty: true
        stdin_open: true
        command: ["sh", "-c", "service ssh start; bash"]

    hdfs-slave2:
        image: matnar/hadoop:3.3.2
        container_name: hdfs-slave2
        hostname: slave2
        networks:
            - sae-net
        tty: true
        stdin_open: true
        command: ["sh", "-c", "service ssh start; bash"]

    # Ingestion Layer - NiFi
    nifi:
        image: apache/nifi:latest
        container_name: nifi
        hostname: nifi
        networks:
            - sae-net
        ports:
            - "8443:8443" # NiFi Web UI https
        environment:
            - NIFI_WEB_HTTP_PORT=8080
            - SINGLE_USER_CREDENTIALS_USERNAME=admin
            - SINGLE_USER_CREDENTIALS_PASSWORD=prova123456789prova
        volumes:
            - ./data/raw:/opt/nifi/nifi-current/data

    # Processing Layer - Spark
    spark-master:
        image: apache/spark:3.5.1
        container_name: spark-master
        hostname: spark-master
        user: root
        networks:
            - sae-net
        # Use absolute paths to the binaries
        command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
        ports:
            - '8080:8080' # Spark Master Web UI
            - '7077:7077' # Spark Master Port
        volumes:
            - ./data:/opt/spark/data
            - ./spark:/opt/spark/scripts
    
    spark-worker:
        image: apache/spark:3.5.1
        container_name: spark-worker
        hostname: spark-worker
        user: root
        networks:
            - sae-net
        depends_on:
            - spark-master
        # Use absolute paths and point to the master service name
        command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
        volumes:
            - ./data:/opt/spark/data

    # Visualization Layer - Redis + Grafana
    redis:
        image: redis:latest
        container_name: redis
        hostname: redis
        networks:
            - sae-net
        ports:
            - "6379:6379" # Redis Port

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        hostname: grafana
        networks:
            - sae-net
        ports:
            - "3000:3000" # Grafana Web UI
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=prova123456789prova
        depends_on:
            - redis

