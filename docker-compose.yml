name: sky-analytics-engine

# --- BASE CONFIGURATIONS ---

# Base configuration for HDFS worker nodes
x-hdfs-worker-base: &hdfs-worker-base
    image: matnar/hadoop:3.3.2
    user: root
    networks:
        - sae-net
    tty: true
    stdin_open: true
    volumes:
        - ./hadoop/config/core-site.xml:/usr/local/hadoop/etc/hadoop/core-site.xml:ro
        - ./hadoop/config/hdfs-site.xml:/usr/local/hadoop/etc/hadoop/hdfs-site.xml:ro
    environment:
        - NODE_TYPE=worker
        - HDFS_NAMENODE_HOST=${HDFS_NAMENODE_HOST}
    command: >
        sh -c "/usr/local/hadoop/bin/hdfs datanode & wait"

# Base configuration for Spark worker nodes
x-spark-worker-base: &spark-worker-base
    image: apache/spark:3.5.1
    user: root
    networks:
        - sae-net
    depends_on:
        - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://${SPARK_MASTER_HOST}:7077
    volumes:
        - ./data:/opt/spark/data
    environment:
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
        - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}

# Common configuration for Airflow services
x-airflow-common: &airflow-common
    build:
        context: ./airflow
        dockerfile: Dockerfile
    image: sky-analytics-airflow:latest
    networks:
        - sae-net
    user: "${AIRFLOW_UID:-50000}:0"
    environment: &airflow-common-env
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
        AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
        AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8088/execution/'
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
        AIRFLOW__API_AUTH__JWT_ISSUER: airflow
        AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.default'
        AIRFLOW__API__PORT: ${AIRFLOW_WEB_PORT}
        AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
        AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
        AIRFLOW_CONN_LIVY_DEFAULT: http://${AIRFLOW_CONN_LIVY_HOST}:${AIRFLOW_CONN_LIVY_PORT}
        AIRFLOW_CONN_NIFI_HTTP: ${AIRFLOW_CONN_NIFI_HTTP}
        AIRFLOW_USER: ${AIRFLOW_USER}
        AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD}
        # --- AWS CONFIGURATION (Pass-through) ---
        AWS_ACCESS_KEY_ID:
        AWS_SECRET_ACCESS_KEY:
        AWS_SESSION_TOKEN:
        AWS_DEFAULT_REGION:
    volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./data/airflow/logs:/opt/airflow/logs
        - ./airflow/plugins:/opt/airflow/plugins
        - ./airflow/config:/opt/airflow/config
    depends_on: &airflow-common-depends-on
        airflow-postgres:
            condition: service_healthy

services:

    # =================================================================
    # INGESTION LAYER
    # =================================================================

    # Apache NiFi for Data Ingestion and Orchestration
    nifi:
        image: apache/nifi:latest
        container_name: nifi
        hostname: nifi
        networks:
            sae-net:
                aliases:
                    - nifi.flight-analysis.local
        ports:
            - "8443:8443" # NiFi Web UI https
            - "${NIFI_WEB_HTTP_PORT}:8081" # NiFi Web UI http
            - "8085:8085" # Port for Airflow Site-to-Site
        environment:
            - NIFI_WEB_HTTP_HOST=0.0.0.0
            - NIFI_WEB_HTTP_PORT=${NIFI_WEB_HTTP_PORT}
            - NIFI_WEB_HTTPS_HOST=0.0.0.0
            - NIFI_WEB_PROXY_HOST=${NIFI_WEB_PROXY_HOST}
            - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_USER}
            - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_PASSWORD}
        volumes:
            - ./data/raw:/opt/nifi/nifi-current/data
            - ./data/conv:/opt/nifi/nifi-current/res
            - ./hadoop/config:/opt/nifi/nifi-current/conf/hadoop-config:ro
            - ./nifi/extensions:/opt/nifi/nifi-current/nar_extensions

    # =================================================================
    # STORAGE LAYER
    # =================================================================

    # HDFS NameNode for Distributed File Storage
    hdfs-master:
        image: matnar/hadoop:3.3.2
        container_name: hdfs-master
        user: root
        hostname: hdfs-master
        networks:
            sae-net:
                aliases:
                    - ${HDFS_NAMENODE_HOST}
        ports:
            - "${HDFS_WEB_UI_PORT}:9870" # HDFS Web UI
            - "${HDFS_NAMENODE_PORT}:54310" # HDFS RPC NameNode
        volumes:
            - ./hadoop/config/workers:/usr/local/hadoop/etc/hadoop/workers:ro
            - ./hadoop/config/core-site.xml:/usr/local/hadoop/etc/hadoop/core-site.xml:ro
            - ./hadoop/config/hdfs-site.xml:/usr/local/hadoop/etc/hadoop/hdfs-site.xml:ro
        environment:
            - NODE_TYPE=master
        command: >
          sh -c "if [ ! -d /tmp/hadoop-root/dfs/name ]; then
            /usr/local/hadoop/bin/hdfs namenode -format -force;
          fi;
          /usr/local/hadoop/bin/hdfs namenode &
          echo '[INFO] Wait for NameNode to be ready...';
          until /usr/local/hadoop/bin/hdfs dfsadmin -safemode wait; do
            echo '[INFO] NameNode non ancora pronto, riprovo tra 2 secondi...';
            sleep 2;
          done;
          echo '[INFO] NameNode ready! Creating folders...';
          /usr/local/hadoop/bin/hdfs dfs -mkdir -p /data/conv;
          /usr/local/hadoop/bin/hdfs dfs -chmod -R 777 /data/conv;
            
          /usr/local/hadoop/bin/hdfs dfs -mkdir -p /data/raw;
          /usr/local/hadoop/bin/hdfs dfs -chmod -R 777 /data/raw;
            
          /usr/local/hadoop/bin/hdfs dfs -mkdir -p /bin;
          /usr/local/hadoop/bin/hdfs dfs -chmod -R 777 /bin;
            
          wait"
        tty: true
        stdin_open: true

    # HDFS DataNode Instance 1
    hdfs-worker-1:
        <<: *hdfs-worker-base
        container_name: hdfs-worker-1
        hostname: hdfs-worker-1
        networks:
            sae-net:
                aliases:
                    - hdfs-worker-1.flight-analysis.local
        volumes:
            - ./hadoop/config/core-site.xml:/usr/local/hadoop/etc/hadoop/core-site.xml:ro
            - ./hadoop/config/hdfs-site.xml:/usr/local/hadoop/etc/hadoop/hdfs-site.xml:ro
        depends_on:
            - hdfs-master

    hdfs-worker-2:
        <<: *hdfs-worker-base
        container_name: hdfs-worker-2
        hostname: hdfs-worker-2
        networks:
            sae-net:
                aliases:
                    - hdfs-worker-2.flight-analysis.local
        volumes:
            - ./hadoop/config/core-site.xml:/usr/local/hadoop/etc/hadoop/core-site.xml:ro
            - ./hadoop/config/hdfs-site.xml:/usr/local/hadoop/etc/hadoop/hdfs-site.xml:ro
        depends_on:
            - hdfs-master

    # MinIO for S3 Compatible Object Storage
    minio:
        image: quay.io/minio/minio:latest
        container_name: minio
        hostname: minio
        networks:
            sae-net:
                aliases:
                    - minio.flight-analysis.local
        ports:
            - "${MINIO_PORT}:9000"
            - "${MINIO_CONSOLE_PORT}:9001"
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
        volumes:
            - ./data/minio:/data
        command: server /data --console-address ":9001"

    # =================================================================
    # PROCESSING LAYER
    # =================================================================

    # Apache Spark Master Instance
    spark-master:
        image: apache/spark:3.5.1
        container_name: spark-master
        hostname: spark-master
        user: root
        networks:
            sae-net:
                aliases:
                    - ${SPARK_MASTER_HOST}
        command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
        ports:
            - '${SPARK_MASTER_WEBUI_PORT}:8080' # Spark Master Web UI
            - '${SPARK_MASTER_PORT}:7077' # Spark Master RPC Port
            - '${SPARK_MASTER_APPLICATION_PORT}:4040' # Default Driver UI
        volumes:
            - ./data:/opt/spark/data
        environment:
            - SPARK_MASTER_HOST=${SPARK_MASTER_HOST}
            - SPARK_LOCAL_HOSTNAME=${SPARK_MASTER_HOST}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    
    # Spark Worker Nodes 1 to 10
    spark-worker-1:
        <<: *spark-worker-base
        container_name: spark-worker-1
        hostname: spark-worker-1
        networks:
            sae-net:
                aliases:
                    - spark-worker-1.flight-analysis.local

    spark-worker-2:
        <<: *spark-worker-base
        container_name: spark-worker-2
        hostname: spark-worker-2
        networks:
            sae-net:
                aliases:
                    - spark-worker-2.flight-analysis.local

    spark-worker-3:
        <<: *spark-worker-base
        container_name: spark-worker-3
        hostname: spark-worker-3
        networks:
            sae-net:
                aliases:
                    - spark-worker-3.flight-analysis.local

    # Apache Livy for Spark REST API Access
    livy:
        build:
            context: ./livy
            dockerfile: Dockerfile
        container_name: livy
        hostname: livy
        networks:
            sae-net:
                aliases:
                    - ${AIRFLOW_CONN_LIVY_HOST}
        ports:
            - "${AIRFLOW_CONN_LIVY_PORT}:8998"

    # =================================================================
    # PERSISTENCE LAYER
    # =================================================================

    # PostgreSQL Relational Database for Final Results
    postgres:
        image: postgres:15
        container_name: postgres
        hostname: postgres
        networks:
            sae-net:
                aliases:
                    - databases.flight-analysis.local
                    - postgres.flight-analysis.local
                    - postgres-databases.flight-analysis.local
        ports:
            - "${POSTGRES_PORT}:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - ./data/databases/postgres:/var/lib/postgresql/data

    # Column-Oriented Output - HBase
    hbase:
        image: harisekhon/hbase:latest
        container_name: hbase
        hostname: hbase
        networks:
            sae-net:
                aliases:
                    - hbase-databases.flight-analysis.local
                    - hbase.flight-analysis.local
        ports:
            - "${HBASE_UI_PORT}:16010" # Master UI
            - "${HBASE_ZK_PORT}:2181"  # Zookeeper
            - "16000:16000"            # Master RPC
            - "16020:16020"            # RegionServer RPC
            - "8765:8765"              # Phoenix Query Server
        tty: true
        stdin_open: true

    # Redis Instance for Output Storage
    redis-output:
        image: redis:latest
        container_name: redis-output
        networks:
            sae-net:
                aliases:
                    - redis-databases.flight-analysis.local
                    - redis-output.flight-analysis.local
        ports:
            - "6380:6379"
        command: redis-server

    # CockroachDB Single-Node Instance
    cockroachdb:
        image: cockroachdb/cockroach:latest
        container_name: cockroachdb
        hostname: cockroachdb
        networks:
            sae-net:
                aliases:
                    - cockroachdb.flight-analysis.local
        ports:
            - "${COCKROACH_PORT:-26257}:26257"
            - "${COCKROACH_HTTP_PORT:-8082}:8080"
        command: start-single-node --insecure
        volumes:
            - ./data/databases/cockroach:/cockroach/cockroach-data

    # =================================================================
    # ORCHESTRATION LAYER
    # =================================================================

    # Internal PostgreSQL for Airflow Metadata
    airflow-postgres:
        image: postgres:15
        container_name: airflow-postgres
        hostname: airflow-postgres
        networks:
            - sae-net
        environment:
            - POSTGRES_USER=${AIRFLOW_POSTGRES_USER}
            - POSTGRES_PASSWORD=${AIRFLOW_POSTGRES_PASSWORD}
            - POSTGRES_DB=${AIRFLOW_POSTGRES_DB}
        volumes:
            - ./data/airflow/postgres:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD", "pg_isready", "-U", "${AIRFLOW_POSTGRES_USER}" ]
            interval: 10s
            retries: 5

    # Airflow Initialization Service
    airflow-init:
        <<: *airflow-common
        container_name: airflow-init
        entrypoint: /bin/bash
        user: "0:0"
        command:
            - -c
            - |
                mkdir -p /opt/airflow/{logs,dags,plugins,config}
                chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
                /entrypoint airflow version
                /entrypoint airflow db migrate
                /entrypoint airflow users create \
                    --username "${AIRFLOW_USER}" \
                    --password "${AIRFLOW_PASSWORD}" \
                    --firstname Admin \
                    --lastname User \
                    --role Admin \
                    --email "${AIRFLOW_EMAIL}" || true
        depends_on:
            airflow-postgres:
                condition: service_healthy

    # Apache Airflow Components
    airflow-scheduler:
        <<: *airflow-common
        container_name: airflow-scheduler
        hostname: airflow-scheduler
        command: scheduler
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always
        depends_on:
            <<: *airflow-common-depends-on
            airflow-init:
                condition: service_completed_successfully

    airflow-dag-processor:
        <<: *airflow-common
        container_name: airflow-dag-processor
        hostname: airflow-dag-processor
        command: dag-processor
        healthcheck:
            test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always
        depends_on:
            <<: *airflow-common-depends-on
            airflow-init:
                condition: service_completed_successfully

    airflow-triggerer:
        <<: *airflow-common
        container_name: airflow-triggerer
        hostname: airflow-triggerer
        command: triggerer
        healthcheck:
            test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always
        depends_on:
            <<: *airflow-common-depends-on
            airflow-init:
                condition: service_completed_successfully

    airflow-apiserver:
        <<: *airflow-common
        container_name: airflow-apiserver
        hostname: airflow-apiserver
        networks:
            sae-net:
                aliases:
                    - airflow.flight-analysis.local
        command: api-server
        ports:
            - "${AIRFLOW_WEB_PORT}:8088" # Airflow Web UI
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: always
        depends_on:
            <<: *airflow-common-depends-on
            airflow-init:
                condition: service_completed_successfully

    # =================================================================
    # MONITORING & VISUALIZATION LAYER
    # =================================================================

    # Redis Stack for Performance Metrics Storage and Search
    redis-metrics:
        image: redis/redis-stack:latest
        container_name: redis-metrics
        hostname: redis-metrics
        networks:
            sae-net:
                aliases:
                    - metrics.flight-analysis.local
                    - redis-metrics.flight-analysis.local
        ports:
            - "${REDIS_PORT}:6379" # Redis RPC Port
            - "${REDIS_INSIGHT_PORT}:8001" # RedisInsight Dashboard
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 3s
            retries: 5

    # Tool for Automated RediSearch Index Creation
    redis-init:
        image: redis/redis-stack:latest
        container_name: redis-init
        networks:
            - sae-net
        depends_on:
            redis-metrics:
                condition: service_healthy
        command: >
            sh -c '
              echo "Waiting for Redis host to respond..."
              until redis-cli -h metrics.flight-analysis.local -p ${REDIS_PORT} ping | grep -q "PONG"; do
                sleep 1
              done
            
              echo "Redis alive. Waiting for RediSearch module to be loaded..."
              until redis-cli -h metrics.flight-analysis.local -p ${REDIS_PORT} MODULE LIST | grep -q "search"; do
                echo "RediSearch module not found in MODULE LIST yet - sleeping..."
                sleep 1
              done
            
              echo "RediSearch completely loaded! Executing index creation script..."
            
              redis-cli -h metrics.flight-analysis.local -p ${REDIS_PORT} FT.CREATE phaseIdx ON HASH PREFIX 1 metrics:phases: SCHEMA query TAG approach TAG phase TAG duration NUMERIC wallclock-duration NUMERIC spark-duration NUMERIC timestamp NUMERIC SORTABLE || true;
              sleep 1;
            
              redis-cli -h metrics.flight-analysis.local -p ${REDIS_PORT} FT.CREATE stagesIdx ON HASH PREFIX 1 metrics:stages: SCHEMA query TAG approach TAG phase TAG stageId NUMERIC duration NUMERIC gcTime NUMERIC read NUMERIC written NUMERIC shuffleRead NUMERIC shuffleWrite NUMERIC timestamp NUMERIC SORTABLE || true;
              sleep 1;
            
              redis-cli -h metrics.flight-analysis.local -p ${REDIS_PORT} FT.CREATE executorsIdx ON HASH PREFIX 1 metrics:executors: SCHEMA query TAG approach TAG phase TAG execId TAG host TAG tasks NUMERIC runTime NUMERIC cpuTime NUMERIC gcTime NUMERIC read NUMERIC written NUMERIC shuffleRead NUMERIC shuffleWrite NUMERIC timestamp NUMERIC SORTABLE || true;
            
              echo "RediSearch index configuration batch completed!";
            '

    # Grafana Visualization Tool
    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        hostname: grafana
        networks:
            sae-net:
                aliases:
                    - grafana.flight-analysis.local
        ports:
            - "${GRAFANA_PORT}:3000" # Grafana Web UI Port
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
            - GF_INSTALL_PLUGINS=redis-datasource,volkovlabs-echarts-panel
            - POSTGRES_PORT=${POSTGRES_PORT}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - REDIS_PORT=${REDIS_PORT}
        volumes:
            - ./grafana/datasources:/etc/grafana/provisioning/datasources
            - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
        depends_on:
            - redis-metrics
            - postgres

networks:
    sae-net:
        driver: bridge
        name: sae-net
