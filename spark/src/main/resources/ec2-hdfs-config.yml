# Application configuration for Flight Analysis on EC2
appName: Flight Analysis

# Define which query to run:
# Options: monthly_performance, arrival_delay_ranking, hourly_delay_percentiles
# queryToRun: monthly_performance

# Define which Spark backend API to use for the query execution
# Options: rdd, dataframe, sql
# appBackend: rdd

# Algorithm for Q3 (hourly_delay_percentiles) percentile estimation in the RDD backend
# Options: kll, tdigest
percentileAlgorithm: kll

# --- Input data configuration ---

input:
  type: "hdfs"
  uri: "hdfs://master.flight-analysis.local:54310"
  path: "/data/conv"
  datasetFilename: ""

# --- Output data configuration examples ---

# HDFS Output
output:
   type: "hdfs"
   uri: "hdfs://master.flight-analysis.local:54310"
   path: "/data"
   resultDirectory: "/res"

