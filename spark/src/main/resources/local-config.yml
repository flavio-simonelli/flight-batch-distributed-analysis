# Application configuration for Flight Analysis
appName: Flight Analysis

# Define which query to run:
# Options: monthly_performance, arrival_delay_ranking, hourly_delay_percentiles
queryToRun: monthly_performance

# Define which Spark backend API to use for the query execution
# Options: rdd, dataframe, sql
appBackend: dataframe

# Algorithm for Q3 (hourly_delay_percentiles) percentile estimation in the RDD backend
# Options: kll, tdigest
percentileAlgorithm: kll

# Cluster configuration
sparkCluster:
  master:
    hostname: spark-master.flight-analysis.local
    port: 7077

# --- Input data configuration examples ---

input:
  type: "hdfs"  # Possible types: hdfs, local, s3
  uri: "hdfs://hdfs-master.flight-analysis.local:54310"
  path: "/data/conv"
  datasetFilename: ""

# --- Output data configuration examples ---

# S3 Output
# output:
#   type: "s3"
#   uri: "s3://ff-sabd"
#   path: "/data"
#   resultDirectory: "/res"

# HDFS Output
output:
   type: "hdfs"
   uri: "hdfs://hdfs-master.flight-analysis.local:54310"
   path: "/data"
   resultDirectory: "/res"

