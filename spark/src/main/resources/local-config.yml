# Application configuration for Flight Analysis
appName: Flight Analysis

# Define which query to run:
# Options: monthly_performance, arrival_delay_ranking, hourly_delay_percentiles, airline_clustering
queryToRun: monthly_performance

# Define which Spark backend API to use for the query execution
# Options: rdd, dataframe, sql
appBackend: dataframe

# Algorithm for Q3 percentile estimation in the RDD backend
# Options: kll, tdigest
percentileAlgorithm: kll

# --- STORAGE LAYER ---
inputs:
  hdfs:
    type: "hdfs"
    uri: "hdfs://hdfs-master.flight-analysis.local:54310"
    path: "/data/conv"
  local:
    type: "local"
    path: "/opt/spark/data/conv"
  s3:
    type: "s3"
    uri: "s3a://spark-flight-analysis"
    path: "/data/conv"

# --- PROCESSING LAYER ---
sparkCluster:
  master:
    hostname: spark-master.flight-analysis.local
    port: 7077

# --- PERSISTENCE LAYER ---
outputs:
  hdfs:
    type: "hdfs"
    uri: "hdfs://hdfs-master.flight-analysis.local:54310"
    path: "/data/res"
  postgres:
    type: "postgres"
    hostname: "postgres-databases.flight-analysis.local"
    port: 5432
    database: "flight_db"
    user: "postgres"
    password: "postgres"
  redis:
    type: "redis"
    hostname: "redis-output.flight-analysis.local"
    port: 6379
    database: "0"
  cockroach:
    type: "cockroach"
    hostname: "cockroachdb-databases.flight-analysis.local"
    port: 26257
    database: "defaultdb"
    user: "root"
    password: ""
  hbase:
    type: "hbase"
    hostname: "hbase-databases.flight-analysis.local"
    port: 2181
    database: "flight_results"

# --- MONITORING LAYER ---
metrics:
  redis:
    type: "redis"
    hostname: "metrics.flight-analysis.local"
    port: 6379
    database: "0"
