AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon EMR cluster configured for Apache Spark applications

Parameters:
  ClusterName:
    Type: String
    Default: SparkEMRCluster
    Description: Name of the EMR cluster
  ReleaseLabel:
    Type: String
    Default: emr-7.13.0
    Description: EMR release version (e.g., emr-6.15.0 includes Spark 3.4.1)
  MasterInstanceType:
    Type: String
    Default: m6g.xlarge
    Description: EC2 instance type for the Master node
  CoreInstanceType:
    Type: String
    Default: m6g.xlarge
    Description: EC2 instance type for the Core nodes (Workers)
  CoreInstanceCount:
    Type: Number
    Default: 1
    Description: Number of Core instances for distributed computation
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: SSH key pair name to access nodes (Master and Core)
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet ID where the cluster will be launched
  LogUri:
    Type: String
    Default: s3://logs/emr-logs/
    Description: S3 bucket path to save EMR and Spark logs
  ServiceRole:
    Type: String
    Default: EMR_DefaultRole
    Description: IAM role for the EMR service
  JobFlowRole:
    Type: String
    Default: EMR_EC2_DefaultRole
    Description: IAM instance profile for EC2 nodes

Resources:
  SparkEMRCluster:
    Type: AWS::EMR::Cluster
    Properties:
      Name: !Ref ClusterName
      ReleaseLabel: !Ref ReleaseLabel
      VisibleToAllUsers: true
      LogUri: !Ref LogUri
      ServiceRole: !Ref ServiceRole
      JobFlowRole: !Ref JobFlowRole
      Applications:
        - Name: Spark
        - Name: Hadoop
      Instances:
        Ec2KeyName: !Ref KeyName
        Ec2SubnetId: !Ref SubnetId
        KeepJobFlowAliveWhenNoSteps: true
        MasterInstanceGroup:
          InstanceCount: 1
          InstanceType: !Ref MasterInstanceType
          Name: Master Node
        CoreInstanceGroup:
          InstanceCount: !Ref CoreInstanceCount
          InstanceType: !Ref CoreInstanceType
          Name: Core Nodes
          Market: SPOT
      Tags:
        - Key: Name
          Value: !Ref ClusterName
        - Key: Application
          Value: SparkEngine

Outputs:
  ClusterId:
    Description: Unique ID of the created EMR cluster
    Value: !Ref SparkEMRCluster
  MasterPublicDns:
    Description: Public DNS of the Master node
    Value: !GetAtt SparkEMRCluster.MasterPublicDNS