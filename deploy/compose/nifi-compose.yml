name: flight-analytics-nifi

services:

  # =================================================================
  # INGESTION LAYER
  # =================================================================

  # Apache NiFi for Data Ingestion and Orchestration
  nifi:
    image: apache/nifi:latest
    container_name: nifi
    hostname: ${NIFI_HOST}
    network_mode: host
    environment:
      - NIFI_WEB_HTTP_HOST=${NIFI_WEB_HTTP_HOST}
      - NIFI_WEB_HTTP_PORT=${NIFI_WEB_HTTP_PORT}
      - NIFI_WEB_HTTPS_HOST=${NIFI_WEB_HTTPS_HOST}
      - NIFI_WEB_PROXY_HOST=${NIFI_WEB_PROXY_HOST}
      - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_USER}
      - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_PASSWORD}
    volumes:
      - ./data/raw:/opt/nifi/nifi-current/data
      - ./data/conv:/opt/nifi/nifi-current/res
      - ./hadoop/config:/opt/nifi/nifi-current/conf/hadoop-config:ro
      - ./nifi/extensions:/opt/nifi/nifi-current/nar_extensions
