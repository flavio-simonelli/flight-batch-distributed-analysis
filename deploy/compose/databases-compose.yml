name: flight-analytics-databases

services:
  # =================================================================
  # PERSISTENCE LAYER (Result Databases)
  # =================================================================

  # PostgreSQL Relational Database for Final Results
  postgres:
    image: postgres:15
    container_name: postgres
    hostname: postgres
    network_mode: host
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/databases/postgres:/var/lib/postgresql/data

  # MongoDB Document Database for Final Results
  mongodb:
    image: mongo:latest
    container_name: mongodb
    hostname: mongodb
    network_mode: host
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}

  # Apache HBase Columnar Database for Final Results
  hbase:
    image: harisekhon/hbase:latest
    container_name: hbase
    hostname: hbase
    network_mode: host
    tty: true
    stdin_open: true

  # Redis Instance for Output Storage
  redis-output:
    image: redis:latest
    container_name: redis-output
    hostname: redis-output
    network_mode: host
    command: redis-server
