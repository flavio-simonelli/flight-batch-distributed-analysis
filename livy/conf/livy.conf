# Spark cluster
livy.spark.master = spark://spark-master.flight-analysis.local:7077
livy.spark.deploy-mode = cluster

# Server
livy.server.host = 0.0.0.0
livy.server.port = 8998

# Allow job submission without Kerberos
livy.file.local-dir-whitelist = /opt/spark/scripts/
livy.repl.enable-hive-context = false
livy.server.csrf-protection.enabled = false

# Timeouts
livy.server.session.timeout = 1h
